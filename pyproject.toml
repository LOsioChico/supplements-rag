[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplements-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyrefly"]

[tool.setuptools]
packages = ["supplements_rag"]
package-dir = {"" = "src"}

[tool.ruff]
target-version = "py312"
lint.extend-select = ["I", "UP"]

[tool.pyrefly]
# evals/ scripts import each other as top-level modules (admit, run, verify)
# worker/ targets the Pyodide runtime — workers/js/pyodide imports don't
# resolve locally, so it is out of the typecheck scope
search-path = ["evals"]
project-excludes = ["worker"]
